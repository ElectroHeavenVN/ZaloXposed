plugins {
    alias(libs.plugins.android.application)
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('local.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.ehvn.zaloxposed'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.ehvn.zaloxposed"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile = file(keystoreProperties['signing.storeFile'])
            storePassword = keystoreProperties['signing.storePassword']
            keyAlias = keystoreProperties['signing.keyAlias']
            keyPassword = keystoreProperties['signing.keyPassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.dexkit
    implementation libs.smali.dexlib2
    compileOnly("io.github.libxposed:api:102.0.0")
}