name: Build and publish release APK

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.id || github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Missing signing secrets" >&2
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          cat > local.properties <<EOF
          signing.storeFile=$KEYSTORE_PATH
          signing.storePassword=$SIGNING_STORE_PASSWORD
          signing.keyAlias=$SIGNING_KEY_ALIAS
          signing.keyPassword=$SIGNING_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION_NAME="${TAG_NAME#v}"
          VERSION_CODE=$(git rev-list --count HEAD)
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p release
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "release/ZaloXposed-${apk##*/}"
          done

      - name: Upload APK to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release/*.apk

      - name: Sync README to Xposed Modules Repo
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          TARGET_REPO: Xposed-Modules-Repo/io.github.electroheavenvn.zaloxposed
        run: |
          set -euo pipefail

          TARGET_BRANCH="main"
          FILE_PATH="README.md"
          API_URL="repos/${TARGET_REPO}/contents/${FILE_PATH}"

          NEW_CONTENT_BASE64="$(base64 -w 0 "$FILE_PATH")"

          EXISTING_PAYLOAD="$(gh api "$API_URL?ref=${TARGET_BRANCH}" 2>/dev/null || true)"
          EXISTING_SHA=""
          EXISTING_CONTENT_BASE64=""

          if [ -n "$EXISTING_PAYLOAD" ]; then
            EXISTING_SHA="$(printf '%s' "$EXISTING_PAYLOAD" | jq -r '.sha // empty')"
            EXISTING_CONTENT_BASE64="$(printf '%s' "$EXISTING_PAYLOAD" | jq -r '.content // empty' | tr -d '\r\n')"
          fi

          if [ "$EXISTING_CONTENT_BASE64" = "$NEW_CONTENT_BASE64" ]; then
            echo "README is identical. Skipping sync."
            exit 0
          fi

          COMMIT_MSG="Sync README.md from ${GITHUB_REPOSITORY}@${{ github.event.release.tag_name }}"

          if [ -n "$EXISTING_SHA" ]; then
            gh api \
              --method PUT \
              "$API_URL" \
              -f message="$COMMIT_MSG" \
              -f content="$NEW_CONTENT_BASE64" \
              -f branch="$TARGET_BRANCH" \
              -f sha="$EXISTING_SHA"
          else
            gh api \
              --method PUT \
              "$API_URL" \
              -f message="$COMMIT_MSG" \
              -f content="$NEW_CONTENT_BASE64" \
              -f branch="$TARGET_BRANCH"
          fi

      - name: Publish APK to Xposed Modules Repo
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          TARGET_REPO: Xposed-Modules-Repo/io.github.electroheavenvn.zaloxposed
          SOURCE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail

          VERSION_NAME="${SOURCE_TAG#v}"
          VERSION_CODE="$(git rev-list --count HEAD)"
          TARGET_TAG="${VERSION_CODE}-${VERSION_NAME}"

          APK="$(find release -maxdepth 1 -type f -name '*.apk' | sort | head -n1)"
          if [ -z "$APK" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi

          NOTES_FILE="$RUNNER_TEMP/xposed-release-notes.md"
          printf '%s' "$RELEASE_BODY" > "$NOTES_FILE"

          gh release create "$TARGET_TAG" "$APK" \
            --repo "$TARGET_REPO" \
            --target main \
            --title "$VERSION_NAME" \
            --notes-file "$NOTES_FILE" \
            --draft

          gh release edit "$TARGET_TAG" \
            --repo "$TARGET_REPO" \
            --draft=false