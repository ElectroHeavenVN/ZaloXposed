name: Build and publish nightly APK

on:
  push:
    branches:
      - 'dev'
    tags-ignore:
      - '**'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'ZaloXposedNative/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
      - '.github/workflows/build-nightly.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download native libraries
        env:
          GH_TOKEN: ${{ secrets.ZALOXPOSEDNATIVE_REPO_TOKEN }}
        run: |
          ASSET_URL="$(gh api \
            repos/ElectroHeavenVN/ZaloXposedNative/releases/tags/lib \
            --jq '.assets[] | select(.name == "Output.zip") | .url')"
          if [ -z "$ASSET_URL" ]; then
            echo "Output.zip not found in release tag lib" >&2
            exit 1
          fi
          gh api "$ASSET_URL" \
            --header 'Accept: application/octet-stream' \
            > "$RUNNER_TEMP/Output.zip"
          unzip -q -o "$RUNNER_TEMP/Output.zip" -d ZaloXposedNative

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Missing signing secrets" >&2
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          cat > local.properties <<EOF
          signing.storeFile=$KEYSTORE_PATH
          signing.storePassword=$SIGNING_STORE_PASSWORD
          signing.keyAlias=$SIGNING_KEY_ALIAS
          signing.keyPassword=$SIGNING_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_CODE=$(git rev-list --count HEAD)
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="nightly-${SHORT_SHA}"

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p release
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "release/ZaloXposed-${apk##*/}"
          done

      - name: Recreate nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin --delete nightly 2>/dev/null || true
          git tag -d nightly 2>/dev/null || true
          git tag nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          generate_release_notes: false
          files: release/*.apk

      - name: Publish APK to Xposed Modules Repo
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          TARGET_REPO: Xposed-Modules-Repo/io.github.electroheavenvn.zaloxposed
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing XPOSED_REPO_TOKEN secret" >&2
            exit 1
          fi

          SHORT_SHA="$(git rev-parse --short HEAD)"
          VERSION_NAME="nightly-${SHORT_SHA}"
          VERSION_CODE="$(git rev-list --count HEAD)"
          TARGET_TAG="${VERSION_CODE}-${VERSION_NAME}"

          APK="$(find release -maxdepth 1 -type f -name '*.apk' | sort | head -n1)"
          if [ -z "$APK" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi

          NOTES_FILE="$RUNNER_TEMP/xposed-release-notes.md"
          git log -1 --pretty=format:"Nightly build (%h)%n%n%B" > "$NOTES_FILE"

          gh release delete "$TARGET_TAG" \
            --repo "$TARGET_REPO" \
            --yes \
            --cleanup-tag 2>/dev/null || true

          gh release create "$TARGET_TAG" "$APK" \
            --repo "$TARGET_REPO" \
            --target main \
            --title "$VERSION_NAME" \
            --notes-file "$NOTES_FILE" \
            --prerelease \
            --draft

          gh release edit "$TARGET_TAG" \
            --repo "$TARGET_REPO" \
            --draft=false \
            --prerelease
