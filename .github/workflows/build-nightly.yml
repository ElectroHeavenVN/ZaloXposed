name: Build and publish APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Missing signing secrets" >&2
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          cat > local.properties <<EOF
          signing.storeFile=$KEYSTORE_PATH
          signing.storePassword=$SIGNING_STORE_PASSWORD
          signing.keyAlias=$SIGNING_KEY_ALIAS
          signing.keyPassword=$SIGNING_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p release
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "release/ZaloXposed-${apk##*/}"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          generate_release_notes: true
          files: release/*.apk

      - name: Sync nightly tag with main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "$GITHUB_SHA"
          git push origin nightly --force
